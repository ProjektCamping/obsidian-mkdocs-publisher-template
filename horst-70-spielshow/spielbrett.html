/* ========================= Spiellogik ==================================== */
const grid = document.getElementById("grid");
const qview = document.getElementById("qview");
const scores = { A: 0, B: 0 };
let current = null;   // { cat, tile } oder { finale: true }
let revealed = false;

function addPts(team, d) {
  scores[team] = Math.max(0, scores[team] + d);
  document.getElementById("pts" + team).textContent = scores[team];
}

function buildGrid() {
  CATEGORIES.forEach(cat => {
    shuffle(cat.questions);   // Fragen je Rubrik in zufälliger Reihenfolge
    cat.used = 0;
    const t = document.createElement("button");
    t.className = "tile";
    t.innerHTML = `<span class="emoji">${cat.emoji}</span>${cat.name}<span class="count"></span>`;
    t.onclick = () => openQuestion(cat, t);
    cat.tile = t;
    updateTile(cat);
    grid.appendChild(t);
  });
  const f = document.createElement("button");
  f.className = "tile finale";
  f.innerHTML = `<span class="emoji">${FINALE.emoji}</span>${FINALE.name}<span class="count">Schätzfrage mit Einsatz</span>`;
  f.onclick = () => openFinale(f);
  grid.appendChild(f);
}

  const left = cat.questions.length - cat.used;
  cat.tile.querySelector(".count").textContent =
    left > 0 ? `${left} Frage${left > 1 ? "n" : ""} übrig` : "gespielt ✓";
  cat.tile.classList.toggle("done", left === 0);
  cat.tile.disabled = left === 0;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function openQuestion(cat, tile) {
  const q = cat.questions[cat.used];
  if (!q) return;
  current = { cat };
  revealed = false;

  document.getElementById("qcat").textContent = `${cat.emoji} ${cat.name}`;
  document.getElementById("qtext").textContent = q.q;

  const order = shuffle(q.a.map((_, i) => i));
  const box = document.getElementById("answers");
  box.innerHTML = "";
  order.forEach((origIdx, pos) => {
    const el = document.createElement("button");
    el.className = "answer";
    el.dataset.correct = (origIdx === q.correct) ? "1" : "0";
    el.innerHTML = `<span class="letter">${"ABCD"[pos]}</span><span>${q.a[origIdx]}</span>`;
    el.onclick = () => { if (revealed) return; el.style.borderColor = "#ffd23f"; };
    box.appendChild(el);
  });

  const ex = document.getElementById("explain");
  ex.textContent = "💡 " + q.info;
  ex.classList.remove("show");

  document.getElementById("btnTimer").style.display = "";
  document.getElementById("btnReveal").style.display = "";
  document.getElementById("btnPtA").style.display = "none";
  document.getElementById("btnPtB").style.display = "none";
  showQView(true);
}

function openFinale(tile) {
  current = { finale: true, tile };
  revealed = false;
  document.getElementById("qcat").textContent = `${FINALE.emoji} FINALE – erst Punkte setzen, dann schätzen!`;
  document.getElementById("qtext").textContent = FINALE.q;
  document.getElementById("answers").innerHTML = "";
  const ex = document.getElementById("explain");
  ex.textContent = "💡 " + FINALE.info;
  ex.classList.add("show");
  document.getElementById("btnTimer").style.display = "";
  document.getElementById("btnReveal").style.display = "";
  document.getElementById("btnPtA").style.display = "none";
  document.getElementById("btnPtB").style.display = "none";
  showQView(true);
}

function reveal() {
  if (!current || revealed) return;
  revealed = true;
  stopTimer();
  if (current.finale) {
    document.getElementById("qtext").textContent = FINALE.q + "  →  " + FINALE.answer;
    current.tile.classList.add("done");
    current.tile.disabled = true;
  } else {
    document.querySelectorAll("#answers .answer").forEach(el => {
      el.classList.add(el.dataset.correct === "1" ? "correct" : "wrong");
    });
    document.getElementById("explain").classList.add("show");
    current.cat.used++;
    updateTile(current.cat);
  }
  document.getElementById("btnTimer").style.display = "none";
  document.getElementById("btnReveal").style.display = "none";
  document.getElementById("lblA").textContent = document.getElementById("nameA").value;
  document.getElementById("lblB").textContent = document.getElementById("nameB").value;
  document.getElementById("btnPtA").style.display = "";
  document.getElementById("btnPtB").style.display = "";
}

function backToGrid() {
  stopTimer();
  current = null;
  showQView(false);
}

function showQView(on) {
  qview.classList.toggle("active", on);
  grid.classList.toggle("hidden", on);
}

/* ========================= Countdown ===================================== */
const COUNTDOWN_SECONDS = 10;
const overlay = document.getElementById("timerOverlay");
const timerNum = document.getElementById("timerNum");
const timerSub = document.getElementById("timerSub");
let timerId = null;
let audioCtx = null;

function beep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) { /* kein Ton möglich – Countdown läuft trotzdem */ }
}

function startTimer() {
  if (!current || revealed || timerId) return;
  let t = COUNTDOWN_SECONDS;
  overlay.classList.add("show");
  timerSub.textContent = "Antworten überlegen …";
  const show = () => {
    timerNum.textContent = t;
    timerNum.className = "timer-num" + (t <= 3 ? " hurry" : "");
    beep(t <= 3 ? 880 : 660, 0.12);
  };
  show();
  timerId = setInterval(() => {
    t--;
    if (t > 0) { show(); return; }
    clearInterval(timerId);
    timerNum.textContent = "⏰ ZEIT VORBEI!";
    timerNum.className = "timer-num timeup";
    timerSub.textContent = "Karten hoch! (Klick zum Schließen)";
    beep(1200, 0.6);
    timerId = setTimeout(() => stopTimer(), 3000);
  }, 1000);
}

function stopTimer() {
  clearInterval(timerId);
  clearTimeout(timerId);
  timerId = null;
  overlay.classList.remove("show");
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " " && current && !revealed) { e.preventDefault(); startTimer(); }
  if (e.key === "Enter" && current && !revealed) reveal();
  if (e.key === "Escape" && current) { if (timerId) stopTimer(); else backToGrid(); }
});

buildGrid();
</script>
