<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>A/B/C-Antwortkarten zum Ausdrucken</title>
<!--
  Antwortkarten für "Wer weiß denn sowas, Horst?"

  EIN A4-BLATT = EIN KOMPLETTER SATZ (A, B, C) für einen Gast.
  Drucken (Strg+P) -> Querformat, Ränder: "Keine" (oder minimal).
  Danach nur 2 gerade Schnitte entlang der gestrichelten Linien,
  fertig sind drei Karten à 9,9 x 21 cm.
  Pro Gast ein Blatt drucken. Am besten auf festes Papier (160-200 g).
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: A4 landscape; margin: 0; }

  html, body { background: #f0f0f0; }
  .sheet {
    width: 297mm; height: 210mm;
    margin: 10px auto;
    background: #fff;
    display: flex;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  @media print {
    html, body { background: #fff; }
    .sheet { margin: 0; box-shadow: none; page-break-after: always; }
    .hint { display: none; }
  }

  .card {
    width: 99mm; height: 210mm;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8mm;
    position: relative;
    font-family: Arial, Helvetica, sans-serif;
  }
  /* Schnittlinien: nur 2 Schnitte nötig */
  .card + .card { border-left: 0.5mm dashed #999; }
  .card + .card::before {
    content: "✂";
    position: absolute;
    left: -3.2mm; top: 4mm;
    font-size: 5mm; color: #999;
    transform: rotate(90deg);
  }

  .frame {
    width: 85mm; height: 190mm;
    border: 2.5mm solid currentColor;
    border-radius: 8mm;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10mm;
  }
  .letter {
    font-size: 62mm;
    font-weight: 900;
    line-height: 1;
  }
  .sub {
    font-size: 5.5mm;
    font-weight: 600;
    color: #444;
    text-align: center;
    padding: 0 6mm;
  }
  .a { color: #1d54b0; }
  .b { color: #1f8a3d; }
  .c { color: #c0392b; }

  .hint {
    text-align: center;
    font-family: Arial, sans-serif;
    color: #555; font-size: 14px;
    padding: 12px;
  }
</style>
</head>
<body>

<p class="hint">
  Drucken mit Strg+P → <strong>Querformat</strong>, Ränder „Keine".
  Ein Blatt = ein Satz (A, B, C) → nur 2 Schnitte entlang der gestrichelten Linien.
  Pro Gast ein Blatt drucken.
</p>

<div class="sheet">
  <div class="card a">
    <div class="frame">
      <div class="letter">A</div>
      <div class="sub">Wer weiß denn sowas, Horst?</div>
    </div>
  </div>
  <div class="card b">
    <div class="frame">
      <div class="letter">B</div>
      <div class="sub">Wer weiß denn sowas, Horst?</div>
    </div>
  </div>
  <div class="card c">
    <div class="frame">
      <div class="letter">C</div>
      <div class="sub">Wer weiß denn sowas, Horst?</div>
    </div>
  </div>
</div>

</body>
</html>
