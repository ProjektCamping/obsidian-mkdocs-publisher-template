<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>A/B/C-Antwortkarten zum Ausdrucken</title>
<!--
  Antwortkarten für "Wer weiß denn sowas, Horst?"
  Öffnen -> Drucken (Strg+P) -> Querformat, 1 Seite pro Karte.
  Pro Team einen Satz drucken (Seiten 1-3 = Satz 1, Seiten 4-6 = Satz 2),
  am besten auf festes Papier oder auf Pappe kleben.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .card {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    page-break-after: always;
    font-family: Arial, sans-serif;
    border: 14px solid currentColor;
  }
  .card .letter { font-size: 60vh; font-weight: 900; line-height: 1; }
  .card .sub { font-size: 4vh; margin-top: 2vh; font-weight: 600; }
  .a { color: #1d54b0; }
  .b { color: #1f8a3d; }
  .c { color: #c0392b; }
</style>
</head>
<body>
  <div class="card a"><div class="letter">A</div><div class="sub">Wer weiß denn sowas, Horst?</div></div>
  <div class="card b"><div class="letter">B</div><div class="sub">Wer weiß denn sowas, Horst?</div></div>
  <div class="card c"><div class="letter">C</div><div class="sub">Wer weiß denn sowas, Horst?</div></div>
  <div class="card a"><div class="letter">A</div><div class="sub">Wer weiß denn sowas, Horst?</div></div>
  <div class="card b"><div class="letter">B</div><div class="sub">Wer weiß denn sowas, Horst?</div></div>
  <div class="card c"><div class="letter">C</div><div class="sub">Wer weiß denn sowas, Horst?</div></div>
</body>
</html>
